[package]
name = "mdlint"
version = "0.1.0"
edition = "2021"
description = "Lints Markdown files for real style footguns — heading-level jumps, trailing whitespace, bare URLs, duplicate headings, tab-indented lists — no Node/npm required"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/mdlint"
readme = "README.md"
keywords = ["markdown", "lint", "cli", "documentation", "style"]
categories = ["command-line-utilities"]

[lib]
name = "mdlint"
path = "src/lib.rs"

[[bin]]
name = "mdlint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"
